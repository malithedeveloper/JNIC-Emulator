<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">JNIC Emulator architecture</title>
  <desc id="desc">A JAR or PE is parsed, validated, mapped, and interpreted as inert data before a report is produced.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111b34"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#background)"/>
  <circle cx="1110" cy="-30" r="250" fill="#2563eb" opacity=".08"/>
  <circle cx="110" cy="590" r="260" fill="#f97316" opacity=".07"/>

  <text x="64" y="76" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">JNIC Emulator</text>
  <text x="64" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="17">Bounded, evidence-driven analysis in safe Rust</text>
  <rect x="1016" y="52" width="198" height="42" rx="21" fill="#132b24" stroke="#22c55e" stroke-opacity=".55"/>
  <circle cx="1042" cy="73" r="7" fill="#22c55e"/>
  <text x="1060" y="79" fill="#bbf7d0" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="600">0 target calls</text>

  <g filter="url(#shadow)">
    <rect x="62" y="180" width="202" height="220" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="82" y="202" width="162" height="54" rx="12" fill="#17233b"/>
    <path d="M100 215h31l9 10h25v19h-65z" fill="#f59e0b" opacity=".92"/>
    <text x="200" y="236" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">input.jar</text>
    <rect x="82" y="270" width="162" height="54" rx="12" fill="#17233b"/>
    <rect x="101" y="282" width="48" height="30" rx="4" fill="#60a5fa" opacity=".9"/>
    <text x="200" y="304" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">native.dll</text>
    <text x="163" y="361" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Untrusted input</text>
    <text x="163" y="382" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="12">read as bytes only</text>
  </g>

  <path d="M275 290 H334" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="350" y="148" width="570" height="316" rx="24" fill="#0e1a2e" stroke="#334155"/>
    <rect x="350" y="148" width="570" height="9" rx="5" fill="url(#rust)"/>
    <text x="382" y="200" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Rust analysis core</text>
    <text x="874" y="198" text-anchor="end" fill="#fdba74" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">unsafe_code = forbid</text>

    <g font-family="Inter,Segoe UI,sans-serif">
      <rect x="382" y="230" width="226" height="76" rx="14" fill="#14243d" stroke="#3b82f6" stroke-opacity=".55"/>
      <text x="402" y="260" fill="#bfdbfe" font-size="16" font-weight="600">Container + JVM parser</text>
      <text x="402" y="284" fill="#94a3b8" font-size="13">ZIP · class file · MUTF-8</text>

      <rect x="662" y="230" width="226" height="76" rx="14" fill="#14243d" stroke="#8b5cf6" stroke-opacity=".55"/>
      <text x="682" y="260" fill="#ddd6fe" font-size="16" font-weight="600">Resource + PE parser</text>
      <text x="682" y="284" fill="#94a3b8" font-size="13">LZMA2 · PE32+ · exports</text>

      <rect x="382" y="334" width="226" height="76" rx="14" fill="#14243d" stroke="#f97316" stroke-opacity=".6"/>
      <text x="402" y="364" fill="#fed7aa" font-size="16" font-weight="600">Method mapper</text>
      <text x="402" y="388" fill="#94a3b8" font-size="13">loader export → native RVA</text>

      <rect x="662" y="334" width="226" height="76" rx="14" fill="#14243d" stroke="#22c55e" stroke-opacity=".6"/>
      <text x="682" y="364" fill="#bbf7d0" font-size="16" font-weight="600">Bounded interpreter</text>
      <text x="682" y="388" fill="#94a3b8" font-size="13">CFG · loops · JNI origins</text>
    </g>
    <path d="M608 268 H650" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M775 310 V326" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M650 372 H616" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <path d="M932 290 H991" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1007" y="197" width="211" height="188" rx="20" fill="#111c31" stroke="#334155"/>
    <rect x="1035" y="224" width="155" height="112" rx="10" fill="#08111f"/>
    <circle cx="1054" cy="243" r="4" fill="#ef4444"/>
    <circle cx="1068" cy="243" r="4" fill="#f59e0b"/>
    <circle cx="1082" cy="243" r="4" fill="#22c55e"/>
    <g fill="#93c5fd" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10">
      <text x="1050" y="268">PE SECTIONS</text>
      <text x="1050" y="285">METHODS  50/50</text>
      <text x="1050" y="302">JNI SITES 862</text>
      <text x="1050" y="319">HOST RUN   0</text>
    </g>
    <text x="1112" y="363" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="600">Evidence report</text>
  </g>

  <text x="640" y="520" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="14">No JVM · no native loader · no host import resolution · configurable safety budgets</text>
</svg>
