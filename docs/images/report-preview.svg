<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img" aria-labelledby="title desc">
  <title id="title">Example JNIC Emulator report</title>
  <desc id="desc">A terminal-style preview of input metadata, mapped methods, control flow, and JNI call sites.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182237"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="670" rx="24" fill="#e8eef7"/>
  <g filter="url(#shadow)">
    <rect x="55" y="40" width="1170" height="585" rx="18" fill="url(#frame)"/>
    <rect x="55" y="40" width="1170" height="48" rx="18" fill="#202a3e"/>
    <rect x="55" y="70" width="1170" height="18" fill="#202a3e"/>
    <circle cx="84" cy="64" r="7" fill="#fb7185"/>
    <circle cx="108" cy="64" r="7" fill="#fbbf24"/>
    <circle cx="132" cy="64" r="7" fill="#4ade80"/>
    <text x="640" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14">analysis.txt — JNIC Emulator</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">
    <text x="82" y="124" fill="#60a5fa">JNIC CONTROLLED STATIC EMULATION REPORT</text>
    <text x="82" y="154" fill="#94a3b8">Safety Mode</text><text x="255" y="154" fill="#e2e8f0">: PARSE + BOUNDED SYMBOLIC INTERPRETATION</text>
    <text x="82" y="180" fill="#94a3b8">Host Execution</text><text x="255" y="180" fill="#4ade80">: TARGET CODE NEVER LOADED OR INVOKED</text>
    <text x="82" y="206" fill="#94a3b8">SHA-256</text><text x="255" y="206" fill="#cbd5e1">: 02d7…82ae</text>
    <text x="82" y="232" fill="#94a3b8">PE Payload</text><text x="255" y="232" fill="#cbd5e1">: 126.00 KiB</text>
    <text x="82" y="258" fill="#94a3b8">Methods Mapped</text><text x="255" y="258" fill="#fbbf24">: 50 / 50</text>
    <text x="82" y="284" fill="#94a3b8">JNI Call Sites</text><text x="255" y="284" fill="#c4b5fd">: 862</text>

    <line x1="82" y1="310" x2="1194" y2="310" stroke="#334155"/>
    <text x="82" y="342" fill="#60a5fa">CLASS example.app.Sample</text>
    <text x="82" y="370" fill="#94a3b8">Loader export RVA</text><text x="280" y="370" fill="#e2e8f0">: 0xceb5</text>
    <text x="82" y="398" fill="#94a3b8">Declared methods</text><text x="280" y="398" fill="#e2e8f0">: 1</text>

    <text x="112" y="440" fill="#f8fafc">public static void analyze(java.lang.String[] arg0)</text>
    <text x="112" y="470" fill="#94a3b8">Native RVA</text><text x="305" y="470" fill="#fdba74">: 0x7371</text>
    <text x="112" y="498" fill="#94a3b8">Control flow</text><text x="305" y="498" fill="#cbd5e1">: 571 blocks, 371 branches, 129 back-edges</text>
    <text x="112" y="526" fill="#94a3b8">Static emulation</text><text x="305" y="526" fill="#cbd5e1">: 4,770 instructions, 3,681 states</text>
    <text x="112" y="554" fill="#94a3b8">JNI calls</text><text x="305" y="554" fill="#c4b5fd">: ExceptionCheck, CallVoidMethod, GetStaticObjectField</text>

    <line x1="82" y1="579" x2="1194" y2="579" stroke="#334155"/>
    <text x="82" y="608" fill="#4ade80">Host instructions executed from target: 0</text>
  </g>
</svg>
