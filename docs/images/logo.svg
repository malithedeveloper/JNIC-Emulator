<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">JNIC Emulator</title>
  <desc id="desc">An original JNIC Emulator logo showing native code isolated inside a bounded emulation orbit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset=".55" stop-color="#0c1729"/>
      <stop offset="1" stop-color="#121b35"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset=".5" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="orbit-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1280" height="480" rx="28" fill="url(#background)"/>
  <circle cx="242" cy="241" r="225" fill="url(#glow)"/>
  <path d="M1030-20L1280 80V0z" fill="#2563eb" opacity=".07"/>
  <path d="M990 480l290-165v165z" fill="#f43f5e" opacity=".05"/>

  <!-- bounded emulation orbit -->
  <g transform="translate(242 240)">
    <ellipse rx="178" ry="148" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 10"/>
    <path d="M-154-74C-92-181 87-187 157-83" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" marker-end="url(#orbit-arrow)" filter="url(#soft-glow)"/>
    <path d="M154 78C83 184-91 183-158 77" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" marker-end="url(#orbit-arrow)"/>
    <circle cx="-160" cy="-68" r="9" fill="#22d3ee"/>
    <circle cx="158" cy="76" r="9" fill="#a78bfa"/>

    <!-- echo frames communicate emulation rather than host execution -->
    <rect x="-75" y="-89" width="162" height="178" rx="28" fill="none" stroke="#8b5cf6" stroke-width="2" opacity=".18" transform="translate(18 -12)"/>
    <rect x="-75" y="-89" width="162" height="178" rx="28" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".22" transform="translate(-15 11)"/>

    <!-- isolated native-code chip -->
    <g filter="url(#shadow)">
      <rect x="-75" y="-89" width="162" height="178" rx="28" fill="#0a1324" stroke="url(#brand)" stroke-width="4"/>
      <g stroke="#64748b" stroke-width="5" stroke-linecap="round">
        <path d="M-48-104v15M-13-104v15M22-104v15M57-104v15"/>
        <path d="M-48 89v15M-13 89v15M22 89v15M57 89v15"/>
        <path d="M-90-57h15M-90-20h15M-90 20h15M-90 57h15"/>
        <path d="M87-57h15M87-20h15M87 20h15M87 57h15"/>
      </g>
      <text x="6" y="4" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="800" letter-spacing="2">JNIC</text>
      <path d="M-42 28h96" stroke="url(#scan)" stroke-width="3" filter="url(#soft-glow)"/>
      <text x="6" y="56" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13" letter-spacing="2">0x SAFE</text>
    </g>

    <rect x="-70" y="126" width="140" height="31" rx="15.5" fill="#112b27" stroke="#22c55e" stroke-opacity=".55"/>
    <circle cx="-57" cy="141.5" r="4.5" fill="#22c55e"/>
    <text x="8" y="146.5" text-anchor="middle" fill="#bbf7d0" font-family="Inter,Segoe UI,sans-serif" font-size="10.5" font-weight="700">ISOLATED TRACE</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(490 0)">
    <text x="0" y="191" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="67" font-weight="800" letter-spacing="-2">JNIC</text>
    <text x="171" y="191" fill="url(#brand)" font-family="Inter,Segoe UI,sans-serif" font-size="67" font-weight="800" letter-spacing="-2">EMULATOR</text>
    <text x="4" y="238" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="23" letter-spacing=".5">Parse. Map. Emulate safely.</text>

    <g transform="translate(4 278)" font-family="Inter,Segoe UI,sans-serif">
      <rect width="159" height="39" rx="19.5" fill="#10233b" stroke="#3b82f6" stroke-opacity=".55"/>
      <text x="79.5" y="25" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="650">BOUNDED CFG</text>
      <rect x="174" width="147" height="39" rx="19.5" fill="#251a38" stroke="#8b5cf6" stroke-opacity=".6"/>
      <text x="247.5" y="25" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="650">JNI ORIGINS</text>
      <rect x="336" width="186" height="39" rx="19.5" fill="#132b24" stroke="#22c55e" stroke-opacity=".55"/>
      <text x="429" y="25" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="650">0 TARGET CALLS</text>
    </g>

    <text x="5" y="372" fill="#64748b" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15">STATIC ANALYSIS · SAFE BY DESIGN</text>
  </g>
</svg>
