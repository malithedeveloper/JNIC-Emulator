name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Static format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Run self-test
        run: cargo run --locked -- self-test

  dynamic:
    name: Dynamic analysis (Unicorn backend)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Unicorn C library
        run: |
          sudo apt-get update
          sudo apt-get install -y libunicorn-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint with dynamic feature
        run: cargo clippy --all-targets --features dynamic -- -D warnings
      - name: Test dynamic feature
        run: cargo test --features dynamic --locked
      - name: Run dynamic self-test
        run: cargo run --features dynamic --locked -- self-test

  msrv:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85
      - name: Check minimum supported Rust version
        run: cargo check --locked
