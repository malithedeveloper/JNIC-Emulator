[package]
name = "jnic-emulator"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["malidev"]
description = "A safe, research-oriented static emulator for inspecting JNIC-protected Java archives"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/malithedeveloper/JNIC-Emulator"
keywords = ["jnic", "java", "reverse-engineering", "research", "pe"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.100"
cesu8 = "1.1.0"
clap = { version = "4.5.50", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
lzma-rs = "0.3.0"
sha2 = "0.10.9"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
